<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management | pgCanvas</title>
    <link rel="icon" type="image/svg+xml" href="../assets/pgcanvas-logo-icon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .nav-item.active, .nav-item:hover { background: #f0f9fa; color: #0694a2; }
        .role-Admin   { background: #fef9c3; color: #854d0e; }
        .role-Faculty { background: #dbeafe; color: #1d4ed8; }
        .role-Staff   { background: #f0fdf4; color: #16a34a; }
        .status-active   { background: #f0fdf4; color: #16a34a; }
        .status-inactive { background: #fef2f2; color: #dc2626; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-[#f8fafc] text-[#1a1a1a] h-screen overflow-hidden">

<div id="app" class="flex h-screen">

    <aside id="sidebar" class="w-60 min-w-[240px] bg-white border-r border-[#e8ecf0] flex flex-col py-6">
        <div id="sidebar-logo" class="flex items-center gap-2.5 px-5 pb-6 border-b border-[#e8ecf0] text-[1.1rem] text-[#1a1a1a]">
            <img src="../assets/pgcanvas-logo-icon.svg" alt="pgCanvas" id="logo-icon" class="w-7 h-7">
            <span>pg<strong>Canvas</strong></span>
        </div>
        <nav id="sidebar-nav" class="flex-1 px-3 py-4 flex flex-col gap-1">
            <a href="dashboard.html" class="nav-item flex items-center gap-2.5 px-3 py-2.5 rounded-lg no-underline text-[#666] text-[0.9rem] font-medium transition-all duration-150">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
                My Connections
            </a>
            <a href="admin.html" class="nav-item active flex items-center gap-2.5 px-3 py-2.5 rounded-lg no-underline text-[#666] text-[0.9rem] font-medium transition-all duration-150">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                User Management
            </a>
        </nav>
        <div id="sidebar-user" class="flex items-center gap-2.5 px-5 pt-4 border-t border-[#e8ecf0]">
            <div id="user-avatar" class="w-[34px] h-[34px] rounded-full bg-[#0694a2] text-white flex items-center justify-center font-semibold text-[0.85rem] shrink-0"></div>
            <div id="user-info" class="flex-1 min-w-0">
                <span id="user-name" class="block text-[0.85rem] font-semibold text-[#1a1a1a] whitespace-nowrap overflow-hidden text-ellipsis">Loading...</span>
                <span id="user-role" class="block text-[0.75rem] text-[#999]"></span>
            </div>
            <button id="logout-btn" title="Logout" class="bg-transparent border-none cursor-pointer text-[#999] p-1 rounded flex items-center transition-colors hover:text-red-600">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main id="main-content" class="flex-1 overflow-y-auto p-8">
        <header id="page-header" class="mb-8">
            <h1 class="text-[1.75rem] font-bold text-[#1a1a1a]">User Management</h1>
            <p class="text-[#666] text-[0.9rem] mt-1">Manage registered users and their roles</p>
        </header>

        <div id="users-table-container" class="bg-white border border-[#e8ecf0] rounded-xl overflow-hidden">
            <table id="users-table" class="w-full border-collapse text-[0.9rem]">
                <thead>
                    <tr>
                        <th class="bg-[#f8fafc] px-4 py-3 text-left font-semibold text-[#444] border-b border-[#e8ecf0]">Name</th>
                        <th class="bg-[#f8fafc] px-4 py-3 text-left font-semibold text-[#444] border-b border-[#e8ecf0]">Email</th>
                        <th class="bg-[#f8fafc] px-4 py-3 text-left font-semibold text-[#444] border-b border-[#e8ecf0]">Role</th>
                        <th class="bg-[#f8fafc] px-4 py-3 text-left font-semibold text-[#444] border-b border-[#e8ecf0]">Status</th>
                        <th class="bg-[#f8fafc] px-4 py-3 text-left font-semibold text-[#444] border-b border-[#e8ecf0]">Actions</th>
                    </tr>
                </thead>
                <tbody id="users-tbody">
                    <tr><td colspan="5" class="px-4 py-3 text-[#999]">Loading users...</td></tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<script src="../scripts/config.js"></script>
<script src="../scripts/utils/auth-guard.js"></script>
<script src="../scripts/pages/admin.js"></script>
</body>
</html>
