<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | pgCanvas</title>
    <link rel="icon" type="image/svg+xml" href="../assets/pgcanvas-logo-icon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        teal: {
                            DEFAULT: '#0694a2',
                            hover: '#07818f',
                            light: '#f0f9fa',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .conn-card-host { font-family: 'Courier New', monospace; }
        .conn-meta-label { letter-spacing: 0.03em; }
        #test-result.success { background:#f0fdf4; color:#16a34a; border:1px solid #bbf7d0; }
        #test-result.error   { background:#fef2f2; color:#dc2626; border:1px solid #fecaca; }
        .conn-status.online  { background:#f0fdf4; color:#16a34a; }
        .conn-status.offline { background:#f8fafc; color:#999; }
        .nav-item.active, .nav-item:hover { background:#f0f9fa; color:#0694a2; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="font-sans bg-[#f8fafc] text-[#1a1a1a] h-screen overflow-hidden">

<div id="app" class="flex h-screen">

    <aside id="sidebar" class="w-60 min-w-[240px] bg-white border-r border-[#e8ecf0] flex flex-col py-6">

        <div id="sidebar-logo" class="flex items-center gap-2.5 px-5 pb-6 border-b border-[#e8ecf0] text-[1.1rem] text-[#1a1a1a]">
            <img src="../assets/pgcanvas-logo-icon.svg" alt="pgCanvas" id="logo-icon" class="w-7 h-7">
            <span>pg<strong>Canvas</strong></span>
        </div>

        <nav id="sidebar-nav" class="flex-1 px-3 py-4 flex flex-col gap-1">
            <a href="dashboard.html" class="nav-item active flex items-center gap-2.5 px-3 py-2.5 rounded-lg no-underline text-[#666] text-[0.9rem] font-medium transition-all duration-150">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
                My Connections
            </a>
            <a href="admin.html" class="nav-item flex items-center gap-2.5 px-3 py-2.5 rounded-lg no-underline text-[#666] text-[0.9rem] font-medium transition-all duration-150" id="nav-admin" style="display:none">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                User Management
            </a>
        </nav>

        <div id="sidebar-user" class="flex items-center gap-2.5 px-5 pt-4 border-t border-[#e8ecf0]">
            <div id="user-avatar" class="w-[34px] h-[34px] rounded-full bg-[#0694a2] text-white flex items-center justify-center font-semibold text-[0.85rem] shrink-0"></div>
            <div id="user-info" class="flex-1 min-w-0">
                <span id="user-name" class="block text-[0.85rem] font-semibold text-[#1a1a1a] whitespace-nowrap overflow-hidden text-ellipsis">Loading...</span>
                <span id="user-role" class="block text-[0.75rem] text-[#999]"></span>
            </div>
            <button id="logout-btn" title="Logout" class="bg-none border-none cursor-pointer text-[#999] p-1 rounded flex items-center transition-colors duration-150 hover:text-red-600">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </button>
        </div>
    </aside>

    <main id="main-content" class="flex-1 overflow-y-auto p-8">

        <header id="page-header" class="mb-8 flex items-start justify-between">
            <div>
                <h1 class="text-[1.75rem] font-bold text-[#1a1a1a]">My Connections</h1>
                <p id="connections-count" class="text-[#666] text-[0.9rem] mt-1">Loading...</p>
            </div>
            <button id="add-connection-btn" class="bg-[#0694a2] text-white border-none px-[18px] py-[10px] rounded-lg text-[0.9rem] font-medium cursor-pointer transition-colors duration-150 hover:bg-[#07818f]">
                + Add Connection
            </button>
        </header>

        <div id="connections-grid" class="grid gap-4" style="grid-template-columns: repeat(auto-fill, minmax(320px, 1fr))">
            <div class="text-[#999] text-[0.9rem] py-5">Loading connections...</div>
        </div>

    </main>
</div>

<!-- Add/Edit Connection Modal -->
<div id="modal-overlay" class="hidden fixed inset-0 bg-black/35 flex items-center justify-center z-[100] backdrop-blur-[2px]">
    <div id="modal" class="bg-white rounded-2xl p-8 w-full max-w-[500px] max-h-[90vh] overflow-y-auto shadow-[0_20px_60px_rgba(0,0,0,0.15)]">

        <div id="modal-header" class="flex items-center justify-between mb-6">
            <h2 id="modal-title" class="text-[1.2rem] font-bold">Add Connection</h2>
            <button id="modal-close" class="bg-none border-none text-[1.1rem] cursor-pointer text-[#999] w-7 h-7 flex items-center justify-center rounded-md transition-colors duration-150 hover:bg-[#f1f5f9] hover:text-[#333]">✕</button>
        </div>

        <div class="mb-4">
            <label class="block text-[0.85rem] font-medium text-[#444] mb-1.5">Connection Name</label>
            <input type="text" id="conn-name" placeholder="e.g. University DB"
                class="w-full px-3.5 py-2.5 border border-[#e8ecf0] rounded-lg text-[0.9rem] font-[Inter] bg-white outline-none transition-all duration-150 focus:border-[#0694a2] focus:ring-2 focus:ring-[#0694a2]/10">
        </div>

        <div class="mb-4">
            <label class="block text-[0.85rem] font-medium text-[#444] mb-1.5">Host</label>
            <input type="text" id="conn-host" placeholder="e.g. db.example.com"
                class="w-full px-3.5 py-2.5 border border-[#e8ecf0] rounded-lg text-[0.9rem] font-[Inter] bg-white outline-none transition-all duration-150 focus:border-[#0694a2] focus:ring-2 focus:ring-[#0694a2]/10">
        </div>

        <div class="grid grid-cols-[1fr_2fr] gap-3 mb-4">
            <div>
                <label class="block text-[0.85rem] font-medium text-[#444] mb-1.5">Port</label>
                <input type="number" id="conn-port" placeholder="5432" value="5432"
                    class="w-full px-3.5 py-2.5 border border-[#e8ecf0] rounded-lg text-[0.9rem] font-[Inter] bg-white outline-none transition-all duration-150 focus:border-[#0694a2] focus:ring-2 focus:ring-[#0694a2]/10">
            </div>
            <div>
                <label class="block text-[0.85rem] font-medium text-[#444] mb-1.5">Database Name</label>
                <input type="text" id="conn-database" placeholder="postgres"
                    class="w-full px-3.5 py-2.5 border border-[#e8ecf0] rounded-lg text-[0.9rem] font-[Inter] bg-white outline-none transition-all duration-150 focus:border-[#0694a2] focus:ring-2 focus:ring-[#0694a2]/10">
            </div>
        </div>

        <div class="mb-4">
            <label class="block text-[0.85rem] font-medium text-[#444] mb-1.5">Username</label>
            <input type="text" id="conn-username" placeholder="postgres"
                class="w-full px-3.5 py-2.5 border border-[#e8ecf0] rounded-lg text-[0.9rem] font-[Inter] bg-white outline-none transition-all duration-150 focus:border-[#0694a2] focus:ring-2 focus:ring-[#0694a2]/10">
        </div>

        <div class="mb-4">
            <label class="block text-[0.85rem] font-medium text-[#444] mb-1.5">Password</label>
            <input type="password" id="conn-password" placeholder="••••••••"
                class="w-full px-3.5 py-2.5 border border-[#e8ecf0] rounded-lg text-[0.9rem] font-[Inter] bg-white outline-none transition-all duration-150 focus:border-[#0694a2] focus:ring-2 focus:ring-[#0694a2]/10">
        </div>

        <div id="modal-error" class="text-red-600 text-[0.85rem] mt-2 min-h-[20px]"></div>
        <div id="test-result" class="hidden px-3.5 py-2.5 rounded-lg text-[0.85rem] mt-2"></div>

        <div id="modal-actions" class="flex items-center justify-between mt-6 pt-5 border-t border-[#f1f5f9]">
            <button id="test-btn" class="bg-white text-[#0694a2] border border-[#0694a2] px-[18px] py-[10px] rounded-lg text-[0.9rem] font-medium cursor-pointer transition-all duration-150 hover:bg-[#f0f9fa]">
                Test Connection
            </button>
            <div id="modal-right-actions" class="flex gap-2">
                <button id="cancel-btn" class="bg-none text-[#666] border border-[#e8ecf0] px-[18px] py-[10px] rounded-lg text-[0.9rem] cursor-pointer transition-all duration-150 hover:bg-[#f8fafc] hover:text-[#1a1a1a]">
                    Cancel
                </button>
                <button id="save-btn" class="bg-[#0694a2] text-white border-none px-[18px] py-[10px] rounded-lg text-[0.9rem] font-medium cursor-pointer transition-colors duration-150 hover:bg-[#07818f]">
                    Save Connection
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div id="delete-overlay" class="hidden fixed inset-0 bg-black/35 flex items-center justify-center z-[100] backdrop-blur-[2px]">
    <div id="delete-modal" class="bg-white rounded-2xl p-8 max-w-[400px] w-full shadow-[0_20px_60px_rgba(0,0,0,0.15)]">
        <h2 class="text-[1.1rem] font-bold mb-2.5">Delete Connection</h2>
        <p class="text-[#666] text-[0.9rem] mb-6 leading-relaxed">Are you sure you want to delete this connection? This action cannot be undone.</p>
        <div id="delete-actions" class="flex gap-2 justify-end">
            <button id="delete-cancel-btn" class="bg-none text-[#666] border border-[#e8ecf0] px-[18px] py-[10px] rounded-lg text-[0.9rem] cursor-pointer transition-all duration-150 hover:bg-[#f8fafc] hover:text-[#1a1a1a]">
                Cancel
            </button>
            <button id="delete-confirm-btn" class="bg-red-600 text-white border-none px-[18px] py-[10px] rounded-lg text-[0.9rem] cursor-pointer hover:bg-red-700">
                Delete
            </button>
        </div>
    </div>
</div>

<script src="../scripts/config.js"></script>
<script src="../scripts/utils/auth-guard.js"></script>
<script src="../scripts/api/connections.js"></script>
<script src="../scripts/pages/dashboard.js"></script>
</body>
</html>
